<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduGrants</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>

<body>
  <script>
    if (localStorage.getItem("loggedIn") !== "true") {
      window.location.href = "logout.html"; 
    }
  </script>


  <<!-- Sidebar -->
<div class="sidebar">
  <div class="logo">
    <img
      src="images/graducation.png"
      alt="EduGrants Logo"
      width="30"
      height="30"
    />
    <h2>EduGrants</h2>
  </div>

  <div class="profile">
    <img src="https://via.placeholder.com/70" alt="Profile" />
    <h3>John Cruz Galang</h3>
    <span class="verified">Verified Account</span>
  </div>

  <!-- ✅ Fixed menu links -->
  <div class="menu">
    <a href="dashboard.html" class="active">
      <img src="images/dashboard.png" alt="Dashboard" width="35" height="35" />
      Dashboard
    </a>
    <a href="student.html">
      <img src="images/apply.png" alt="Apply Scholarship" width="35" height="35" />
      Apply Scholarship
    </a>
    <a href="renewal.html">
      <img src="images/renewal.png" alt="Renewal" width="35" height="35" />
      Renewal
    </a>
    <a href="logout.html">
      <img src="images/logout.png" alt="Log out" width="35" height="35" />
      Log out
    </a>
  </div>
</div>

  <!-- Main -->
  <div class="main">
    <div class="header">
  <div class="header-left">
  </div>
  <div class="user-info">
    <img 
      src="images/notificaiton.png"
      alt="Notification"
      class="notification-icon"
    />
    <div class="user-name">John Galang</div>
  </div>
</div>

    <div class="dashboard-container">
      <h3>DASHBOARD</h3>
  <div class="dashboard-grid">
    <!-- Bar Chart -->
    <div class="chart-card">
      <h3>Barangay Sindalan Applicants</h3>
      <div class="chart-wrapper">
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <!-- Donut Chart -->
    <div class="chart-card">
      <h3>Tally of 4th District</h3>
      <div class="chart-wrapper">
        <canvas id="donutChart"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- Chart.js Script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>

<script>
  // Bar Chart
  const barCtx = document.getElementById('barChart').getContext('2d');
  const barChart = new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: ['Maligaya', 'Calulut'],
      datasets: [{
        label: 'Applicants',
        data: [5, 12],
        backgroundColor: '#7DD3D4',
        borderRadius: 8,
        barThickness: 80
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: false
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          max: 20,
          ticks: {
            stepSize: 2,
            font: {
              size: 12
            }
          },
          grid: {
            color: '#e0e0e0'
          }
        },
        x: {
          grid: {
            display: false
          },
          ticks: {
            font: {
              size: 14
            }
          }
        }
      }
    }
  });

  // Donut Chart
  const donutCtx = document.getElementById('donutChart').getContext('2d');
  const donutChart = new Chart(donutCtx, {
    type: 'doughnut',
    data: {
      labels: ['Sindalan', 'Calulut'],
      datasets: [{
        data: [2, 2],
        backgroundColor: ['#5BA8B8', '#7DD3D4'],
        borderWidth: 0,
        cutout: '65%'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: true,
          position: 'right',
          labels: {
            usePointStyle: true,
            padding: 20,
            font: {
              size: 14
            },
            generateLabels: function(chart) {
              const data = chart.data;
              return data.labels.map((label, i) => ({
                text: `${label}\n${data.datasets[0].data[i]}`,
                fillStyle: data.datasets[0].backgroundColor[i],
                hidden: false,
                index: i
              }));
            }
          }
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              return context.label + ': ' + context.parsed;
            }
          }
        }
      }
    }
  });
</script>
</body>
</html>
