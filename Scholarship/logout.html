<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduGrants - Login</title>
  <link rel="stylesheet" href="logout.css" />
</head>

<body class="logout-body">
  <div class="logout-left">
    <h1>WELCOME!</h1>
  </div>

  <div class="logout-right">
    <div class="logout-box">
      <h2>Login</h2>
      <input id="email" type="text" placeholder="Username or Email Address" />
      <input id="password" type="password" placeholder="Password" />
      <a href="#" class="logout-forgot">Forgot Password?</a>
      <button class="logout-btn" onclick="login()">Log In</button>
    </div>

    <div class="logout-bottom">
      <p>Don’t have an account yet?</p>
      <button class="logout-register-btn" onclick="window.location.href='register.html'">
        Register
      </button>
    </div>
  </div>

  <!-- ✅ Login Script -->
  <script>
    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      // Simple credential check
      if (email === "example1@gmail.com" && password === "123student") {
        // Save login status
        localStorage.setItem("loggedIn", "true");

        // Redirect to dashboard after successful login
        window.location.href = "dashboard.html";
      } else {
        alert("Invalid email or password. Please try again.");
      }
    }
  </script>
</body>
</html>
